name: CI

on:
  push:
    branches: ['**']
    tags-ignore: [v*]
  pull_request:
    branches: [main]

env:
  NODE_VERSION_USED_FOR_DEVELOPMENT: 16.13.0

jobs:
  check-ignored-files:
    name: Check for commonly ignored files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Check if commit contains files that should be ignored
        run: |
          git clone --depth 1 https://github.com/github/gitignore.git &&
          cat gitignore/Node.gitignore $(find gitignore/Global -name "*.gitignore" | grep -v ModelSim) > all.gitignore &&
          if  [[ "$(git ls-files -iX all.gitignore)" != "" ]]; then
            echo "::error::Please remove these files:"
            git ls-files -iX all.gitignore
            exit 1
          fi

  test:
    name: Build and test
    runs-on: ubuntu-latest
    needs: [check-ignored-files]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION_USED_FOR_DEVELOPMENT }}
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build packages
        run: yarn build

      # - name: Run test and report code coverage
      #   run: yarn test:cover

  vercel-deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [check-ignored-files] # TODO required passing test
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # - name: Setup NodeJS
      #   uses: actions/setup-node@v4
      #   with:
      #     node-version: ${{ env.NODE_VERSION_USED_FOR_DEVELOPMENT }}
      #     registry-url: https://registry.npmjs.org

      # - name: Install dependencies
      #   run: yarn --frozen-lockfile --force

      # # Prebuild source code to speedup the deployment on Vercel
      # - name: Build packages
      #   run: yarn build

      # # https://medium.com/@gturkin/deploy-a-prebuilt-next-js-app-to-vercel-51c5086655b9
      # - name: Fix .next file paths
      #   run: sed -i 's|'`pwd`'|/vercel/path0|g' .next/required-server-files.json .next/trace

      # - run: yarn vercel pull --yes --token=${VERCEL_TOKEN}
      #   env:
      #     VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      #     VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      #     VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # - run: yarn vercel build
